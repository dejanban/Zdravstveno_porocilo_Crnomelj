<style>
  .viz-root {
    --surface: #fcfcfb; --page: #f9f9f7; --ink: #0b0b0b; --ink2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --critical: #d03b3b; --accent: #2a78d6;
    --tile-bg: #f4f3f0; --panel-bg: #f4f3f0; --callout-bg: #fbeeee; --callout-border: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    .viz-root {
      --surface: #1a1a19; --page: #0d0d0d; --ink: #ffffff; --ink2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --critical: #e66767; --accent: #3987e5;
      --tile-bg: #222221; --panel-bg: #1f1f1e; --callout-bg: #2a1d1d; --callout-border: #e66767;
    }
  }
  .page-bg { fill: var(--page); }
  .h-title { font: 700 26px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .h-subtitle { font: 400 14px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .h-meta { font: 400 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .rule { stroke: var(--grid); stroke-width: 1; }
  .section-title { font: 700 16px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .section-note { font: 400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .tile-bg { fill: var(--tile-bg); }
  .tile-accent { fill: var(--accent); }
  .tile-label { font: 600 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); text-transform: uppercase; letter-spacing: .03em; }
  .tile-value { font: 700 24px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .tile-sub { font: 400 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .panel-bg { fill: var(--panel-bg); }
  .bar-label { font: 600 12px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .bar-value { font: 700 12.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); dominant-baseline: middle; }
  .bar-value-ref { font: 400 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .bar-footnote { font: 400 10px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); font-style: italic; }
  .bar-track { fill: var(--grid); }
  .ref-tick { stroke: var(--muted); stroke-width: 2; }
  .grid-v { stroke: var(--grid); stroke-width: 1; }
  .grid-h { stroke: var(--grid); stroke-width: 1; }
  .axis-tick { font: 400 10px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .trend-cr { stroke: var(--accent); stroke-width: 2.5; fill: none; }
  .trend-slo { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .trend-dot-cr { fill: var(--accent); stroke: var(--panel-bg); stroke-width: 2; }
  .trend-dot-slo { fill: var(--muted); stroke: var(--panel-bg); stroke-width: 2; }
  .trend-endlabel-cr { font: 700 12px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .trend-endlabel-slo { font: 400 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .trend-startlabel-cr { font: 600 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .trend-startlabel-slo { font: 400 10.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .legend-label { font: 400 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .callout-bg { fill: var(--callout-bg); stroke: var(--callout-border); stroke-width: 1.5; }
  .callout-title { font: 700 14px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--critical); }
  .callout-text { font: 400 12px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .footer-text { font: 400 10.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
</style>

