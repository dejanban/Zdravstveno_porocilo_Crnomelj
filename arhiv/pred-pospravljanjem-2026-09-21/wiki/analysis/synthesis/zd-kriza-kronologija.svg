<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1093" width="980" height="1093" class="viz-root" role="img" aria-label="Kronologija krize vodstva ZD Crnomelj">
<title>Kronologija krize vodstva ZD Črnomelj, jun. 2025 – maj 2026</title>

<style>
  .viz-root {
    --surface: #fcfcfb; --page: #f9f9f7;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9;
    --routine: #2a78d6; --warn: #eda100; --crit: #d03b3b;
    --routine-bg: color-mix(in srgb, #2a78d6 10%, #fcfcfb);
    --warn-bg: color-mix(in srgb, #eda100 10%, #fcfcfb);
    --crit-bg: color-mix(in srgb, #d03b3b 8%, #fcfcfb);
  }
  @media (prefers-color-scheme: dark) {
    .viz-root {
      --surface: #1a1a19; --page: #0d0d0d;
      --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
      --routine: #3987e5; --warn: #c98500; --crit: #e66767;
      --routine-bg: color-mix(in srgb, #3987e5 16%, #1a1a19);
      --warn-bg: color-mix(in srgb, #c98500 16%, #1a1a19);
      --crit-bg: color-mix(in srgb, #e66767 14%, #1a1a19);
    }
  }
  .page-bg { fill: var(--page); }
  .page-title { font: 700 21px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .page-subtitle { font: 400 12.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .spine { stroke: var(--grid); stroke-width: 3; }
  .marker-routine { fill: var(--routine); stroke: var(--surface); }
  .marker-warning { fill: var(--warn); stroke: var(--surface); }
  .marker-critical { fill: var(--crit); stroke: var(--surface); }
  .date-label { font: 700 12px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .card { stroke: var(--grid); stroke-width: 1; }
  .marker-routine-bg { fill: var(--routine-bg); }
  .marker-warning-bg { fill: var(--warn-bg); }
  .marker-critical-bg { fill: var(--crit-bg); }
  .card-title { font: 700 13.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .card-desc { font: 400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .side-note { fill: none; stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.6; }
  .side-note-text { font: italic 11px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .legend-label { font: 400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink2); }
  .footer-text { font: 400 10px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
</style>

<rect class="page-bg" x="0" y="0" width="980" height="1093"/>
<text x="60" y="46" class="page-title">Kriza vodstva Zdravstvenega doma Črnomelj: kronologija</text><text x="60" y="70" class="page-subtitle">Od ponovnega imenovanja direktorja (jun. 2025) do nezaključenega postopka razrešitve (maj 2026) — z vzporedno preiskavo policije in kriminalistične policije.</text>
<line x1="150" y1="118" x2="150" y2="953.0" class="spine"/><circle cx="150" cy="157.0" r="9" class="marker-routine"/><circle cx="150" cy="157.0" r="9" class="marker-routine" fill="none" stroke-width="2"/><text x="128" y="161.0" text-anchor="end" class="date-label">Jun 2025</text><rect x="190" y="118.0" width="740" height="78" rx="10" class="card marker-routine-bg"/><rect x="190" y="118.0" width="5" height="78" rx="2.5" class="marker-routine"/><text x="214" y="142.0" class="card-title">Ponovno imenovanje direktorja</text><text x="214" y="162.0" class="card-desc">Svet zavoda ponovno imenuje Andreja Matkoviča za direktorja ZD Črnomelj — brez preverbe, da</text><text x="214" y="177.0" class="card-desc">izpolnjuje zakonsko zahtevano 2. stopnjo izobrazbe.</text><circle cx="150" cy="249.0" r="9" class="marker-warning"/><circle cx="150" cy="249.0" r="9" class="marker-warning" fill="none" stroke-width="2"/><text x="128" y="253.0" text-anchor="end" class="date-label">23. 12. 2025</text><rect x="190" y="210.0" width="740" height="78" rx="10" class="card marker-warning-bg"/><rect x="190" y="210.0" width="5" height="78" rx="2.5" class="marker-warning"/><text x="214" y="234.0" class="card-title">Zaprosilo Policijske uprave Novo mesto</text><text x="214" y="254.0" class="card-desc">PU Novo mesto pošlje svetu zavoda zaprosilo glede suma nepravilnosti pri postopku imenovanja</text><text x="214" y="269.0" class="card-desc">direktorja v 2025.</text><circle cx="150" cy="341.0" r="9" class="marker-warning"/><circle cx="150" cy="341.0" r="9" class="marker-warning" fill="none" stroke-width="2"/><text x="128" y="345.0" text-anchor="end" class="date-label">14. 1. 2026</text><rect x="190" y="302.0" width="740" height="78" rx="10" class="card marker-warning-bg"/><rect x="190" y="302.0" width="5" height="78" rx="2.5" class="marker-warning"/><text x="214" y="326.0" class="card-title">1. izredna seja sveta zavoda</text><text x="214" y="346.0" class="card-desc">Svet zavoda odgovori, da je bil postopek izveden pregledno in zakonito. Ob robu: strokovna</text><text x="214" y="361.0" class="card-desc">vodja dr. Gabrijela Plut izrazi nezadovoljstvo z vodstvom in razmišlja o odhodu.</text><circle cx="150" cy="493.0" r="9" class="marker-critical"/><circle cx="150" cy="493.0" r="9" class="marker-critical" fill="none" stroke-width="2"/><text x="128" y="497.0" text-anchor="end" class="date-label">25. 2. 2026</text><rect x="190" y="454.0" width="740" height="78" rx="10" class="card marker-critical-bg"/><rect x="190" y="454.0" width="5" height="78" rx="2.5" class="marker-critical"/><text x="214" y="478.0" class="card-title">Zunanje pravno mnenje</text><text x="214" y="498.0" class="card-desc">Pravno mnenje ugotovi, da imenovanje direktorja NI bilo izvedeno v skladu z zakonom</text><text x="214" y="513.0" class="card-desc">(neustrezna izobrazba).</text><circle cx="150" cy="585.0" r="9" class="marker-warning"/><circle cx="150" cy="585.0" r="9" class="marker-warning" fill="none" stroke-width="2"/><text x="128" y="589.0" text-anchor="end" class="date-label">18. 3. 2026</text><rect x="190" y="546.0" width="740" height="78" rx="10" class="card marker-warning-bg"/><rect x="190" y="546.0" width="5" height="78" rx="2.5" class="marker-warning"/><text x="214" y="570.0" class="card-title">3. izredna seja sveta zavoda</text><text x="214" y="590.0" class="card-desc">Razprava o morebitni predčasni razrešitvi direktorja zaradi neizpolnjevanja zakonskih</text><text x="214" y="605.0" class="card-desc">pogojev za imenovanje.</text><circle cx="150" cy="677.0" r="9" class="marker-critical"/><circle cx="150" cy="677.0" r="9" class="marker-critical" fill="none" stroke-width="2"/><text x="128" y="681.0" text-anchor="end" class="date-label">2. 4. 2026</text><rect x="190" y="638.0" width="740" height="78" rx="10" class="card marker-critical-bg"/><rect x="190" y="638.0" width="5" height="78" rx="2.5" class="marker-critical"/><text x="214" y="662.0" class="card-title">4. izredna seja — postopek razrešitve</text><text x="214" y="682.0" class="card-desc">Svet zavoda formalno ugotovi neizpolnjevanje pogojev in prične postopek predčasne razrešitve</text><text x="214" y="697.0" class="card-desc">direktorja. Najeta zunanja pravna služba.</text><circle cx="150" cy="769.0" r="9" class="marker-critical"/><circle cx="150" cy="769.0" r="9" class="marker-critical" fill="none" stroke-width="2"/><text x="128" y="773.0" text-anchor="end" class="date-label">15. 4. 2026</text><rect x="190" y="730.0" width="740" height="78" rx="10" class="card marker-critical-bg"/><rect x="190" y="730.0" width="5" height="78" rx="2.5" class="marker-critical"/><text x="214" y="754.0" class="card-title">5. izredna seja — kriminalistična policija</text><text x="214" y="774.0" class="card-desc">Razkrito: sektor kriminalistične policije zaprosi za zapisnike sej 2025 ter dokumentacijo o</text><text x="214" y="789.0" class="card-desc">sistemizaciji in pogodbah o zaposlitvi.</text><circle cx="150" cy="861.0" r="9" class="marker-critical"/><circle cx="150" cy="861.0" r="9" class="marker-critical" fill="none" stroke-width="2"/><text x="128" y="865.0" text-anchor="end" class="date-label">23. 4. 2026</text><rect x="190" y="822.0" width="740" height="78" rx="10" class="card marker-critical-bg"/><rect x="190" y="822.0" width="5" height="78" rx="2.5" class="marker-critical"/><text x="214" y="846.0" class="card-title">Javna izjava direktorja (Svet24)</text><text x="214" y="866.0" class="card-desc">Direktor Matković v medijih izrecno zanika „namigovanja o kazenski preiskavi“ — v nasprotju</text><text x="214" y="881.0" class="card-desc">s tem, kar istočasno razkrivajo zapisniki sveta zavoda.</text><circle cx="150" cy="953.0" r="9" class="marker-warning"/><circle cx="150" cy="953.0" r="9" class="marker-warning" fill="none" stroke-width="2"/><text x="128" y="957.0" text-anchor="end" class="date-label">5. 5. 2026</text><rect x="190" y="914.0" width="740" height="78" rx="10" class="card marker-warning-bg"/><rect x="190" y="914.0" width="5" height="78" rx="2.5" class="marker-warning"/><text x="214" y="938.0" class="card-title">6. redna seja — status quo</text><text x="214" y="958.0" class="card-desc">Matković še vedno deluje kot direktor: predstavi program dela in finančni/kadrovski načrt za</text><text x="214" y="973.0" class="card-desc">2026. Postopek razrešitve ni zaključen.</text><rect x="230" y="394.0" width="660" height="46" rx="8" class="side-note"/><text x="246" y="413.0" class="side-note-text">Vzporedno: strokovna vodja</text><text x="246" y="430.0" class="side-note-text">dr. Gabrijela Plut (nezadovoljna, jan. 2026) → v.d. Jožica Fortun Tomažič (potrjeno najkasneje maj 2026).</text>
<circle cx="190" cy="1003.0" r="7" class="marker-routine"/><text x="206" y="1007.0" class="legend-label">Redni upravni koraki</text><circle cx="400" cy="1003.0" r="7" class="marker-warning"/><text x="416" y="1007.0" class="legend-label">Vprašljivo / v obravnavi</text><circle cx="610" cy="1003.0" r="7" class="marker-critical"/><text x="626" y="1007.0" class="legend-label">Potrjeno resno tveganje</text>
<text x="190" y="1043.0" class="footer-text">Vir: primarni zapisniki sveta zavoda ZD Črnomelj (izredne/redne seje, jan.–maj 2026), OCR 2026-07-12; Svet24.si (23. 4. 2026).</text><text x="190" y="1061.0" class="footer-text">Glej tudi organizacijski diagram zdravstveni-dom-mreza.svg in wiki/sources/source-summaries/zd-crnomelj-direktor-razresitev.md.</text>
</svg>