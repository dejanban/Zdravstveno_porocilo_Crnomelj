<text class="tile-value" x="887.5" y="194">3,5</text>
<text class="tile-sub" x="887.5" y="214">proti 3,9 OECD povprečja</text>
<text class="section-title" x="48" y="280">Vedenjski dejavniki tveganja in kronične bolezni — tristopenjska primerjava</text><text class="section-note" x="48" y="292">Stolpec = Občina Črnomelj (NIJZ). Siva črtica = Slovenija (NIJZ/Eurostat). Barvna črtica = povprečje EU/OECD. Diabetes: NIJZ meri le prejemnike</text><text class="section-note" x="48" y="307">zdravil (ožje), EU meri ocenjeno razširjenost (širše) — neposredna primerjava ni strogo metodološko enakovredna, glej opombe spodaj.</text><rect class="panel-bg" x="48" y="328" width="1084" height="284" rx="12"/><line class="grid-v" x1="298.0" y1="342" x2="298.0" y2="588"/><text class="axis-tick" x="298.0" y="602" text-anchor="middle">0%</text><line class="grid-v" x1="390.0" y1="342" x2="390.0" y2="588"/><line class="grid-v" x1="482.0" y1="342" x2="482.0" y2="588"/><text class="axis-tick" x="482.0" y="602" text-anchor="middle">20%</text><line class="grid-v" x1="574.0" y1="342" x2="574.0" y2="588"/><line class="grid-v" x1="666.0" y1="342" x2="666.0" y2="588"/><text class="axis-tick" x="666.0" y="602" text-anchor="middle">40%</text><line class="grid-v" x1="758.0" y1="342" x2="758.0" y2="588"/><line class="grid-v" x1="850.0" y1="342" x2="850.0" y2="588"/><text class="axis-tick" x="850.0" y="602" text-anchor="middle">60%</text><line class="grid-v" x1="942.0" y1="342" x2="942.0" y2="588"/><text class="bar-label" x="62" y="357">Kadilci (dnevni, odrasli)</text><rect class="bar-track" x="298" y="352" width="644.0" height="14" rx="4"/><rect x="298" y="352" width="218.0" height="14" rx="4" style="fill:#ec835a"/><line class="ref-tick" x1="511.4" y1="348" x2="511.4" y2="370"/><line class="ref-tick-eu" x1="463.6" y1="345" x2="463.6" y2="373"/><text class="bar-value" x="956" y="364">23.7%<tspan class="bar-value-ref"> (SLO 23.2% · EU 18%)</tspan></text><text class="bar-footnote" x="62" y="384">Črnomelj/SLO ~5 o.t. nad povprečjem EU; podatek za ČR je iz 2021 (zadnji razpoložljiv).</text><text class="bar-label" x="62" y="401">Prekomerna prehranjenost</text><text class="bar-label" x="62" y="414">odraslih</text><rect class="bar-track" x="298" y="402" width="644.0" height="14" rx="4"/><rect x="298" y="402" width="567.1" height="14" rx="4" style="fill:#ec835a"/><line class="ref-tick" x1="848.0" y1="398" x2="848.0" y2="420"/><line class="ref-tick-eu" x1="763.5" y1="395" x2="763.5" y2="423"/><text class="bar-value" x="956" y="414">61.64%<tspan class="bar-value-ref"> (SLO 59.78% · EU 50.6%)</tspan></text><text class="bar-footnote" x="62" y="434">EU vrednost je ožji kazalnik &quot;prekomerna teža&quot; (BMI≥25); NIJZ verjetno združuje s debelostjo.</text><text class="bar-label" x="62" y="457">Zdravila za povišan krvni tlak</text><rect class="bar-track" x="298" y="452" width="644.0" height="14" rx="4"/><rect x="298" y="452" width="233.5" height="14" rx="4" style="fill:#ec835a"/><line class="ref-tick" x1="505.1" y1="448" x2="505.1" y2="470"/><text class="bar-value" x="956" y="464">25.38%<tspan class="bar-value-ref"> (SLO 22.51% · EU ni podatka)</tspan></text><text class="bar-footnote" x="62" y="484">Ni bilo najdenega neposredno primerljivega EU kazalnika (glej metodološke opombe).</text><text class="bar-label" x="62" y="507">Zdravila za sladkorno bolezen</text><rect class="bar-track" x="298" y="502" width="644.0" height="14" rx="4"/><rect x="298" y="502" width="52.6" height="14" rx="4" style="fill:#fab219"/><line class="ref-tick" x1="348.3" y1="498" x2="348.3" y2="520"/><line class="ref-tick-eu" x1="371.2" y1="495" x2="371.2" y2="523"/><text class="bar-value" x="956" y="514">5.72%<tspan class="bar-value-ref"> (SLO 5.47% · EU 7.96%)</tspan></text><text class="bar-footnote" x="62" y="534">EU vrednost je epidemiološka ocena (širša), NIJZ meri le prejemnike zdravil (ožje) — glej opombe.</text><text class="bar-label" x="62" y="557">Zdravila za duševne motnje</text><rect class="bar-track" x="298" y="552" width="644.0" height="14" rx="4"/><rect x="298" y="552" width="143.9" height="14" rx="4" style="fill:#fab219"/><line class="ref-tick" x1="431.1" y1="548" x2="431.1" y2="570"/><text class="bar-value" x="956" y="564">15.64%<tspan class="bar-value-ref"> (SLO 14.47% · EU ni podatka)</tspan></text><text class="bar-footnote" x="62" y="584">Ni bilo najdenega neposredno primerljivega EU kazalnika.</text><line class="ref-tick" x1="62" y1="642" x2="62" y2="652"/><text class="legend-label" x="72" y="650">Slovenija (povprečje)</text><line class="ref-tick-eu" x1="252" y1="640" x2="252" y2="654"/><text class="legend-label" x="262" y="650">EU / OECD (povprečje)</text><rect x="462" y="640" width="18" height="10" rx="3" style="fill:#2a78d6" class="legend-swatch"/><text class="legend-label" x="488" y="650">Občina Črnomelj (stolpec)</text>
<rect class="tile-bg" x="48.0" y="674" width="535.0" height="96" rx="10"/>
<rect x="48.0" y="674" width="4" height="96" rx="2" style="fill:#0ca30c"/>
<text class="tile-label" x="64.0" y="698">Pričakovana življenjska doba, SLO</text>
<text class="tile-value" x="64.0" y="730">82 let</text>
<text class="tile-sub" x="64.0" y="748">+0,9 leta nad povprečjem OECD (80,1)</text>
<rect class="tile-bg" x="597.0" y="674" width="535.0" height="96" rx="10"/>
<rect x="597.0" y="674" width="4" height="96" rx="2" style="fill:#fab219"/>
<text class="tile-label" x="613.0" y="698">Zdravniki na 1.000 preb., SLO</text>
<text class="tile-value" x="613.0" y="730">3,5</text>
<text class="tile-sub" x="613.0" y="748">pod povprečjem OECD (3,9) — skladno z znanim</text><text class="tile-sub" x="613.0" y="761">primanjkljajem kadra v ZD Črnomelj</text><rect class="callout-bg" x="48" y="798" width="1084" height="204" rx="12"/><text class="callout-title" x="66" y="826">Umrljivost zaradi samomora — najbolj izstopajoč kazalnik</text><text class="bar-label" x="66" y="857">EU (povprečje)</text><rect class="bar-track" x="228" y="844" width="644.0" height="16" rx="4"/><rect x="228" y="844" width="298.6" height="16" rx="4" style="fill:#eda100"/><text class="bar-value" x="882" y="857">10.2 / 100.000</text><text class="bar-label" x="66" y="889">Slovenija (najvišja v EU)</text><rect class="bar-track" x="228" y="876" width="644.0" height="16" rx="4"/><rect x="228" y="876" width="579.6" height="16" rx="4" style="fill:#ec835a"/><text class="bar-value" x="882" y="889">19.8 / 100.000</text><text class="bar-label" x="66" y="921">Občina Črnomelj</text><rect class="bar-track" x="228" y="908" width="644.0" height="16" rx="4"/><rect x="228" y="908" width="500.6" height="16" rx="4" style="fill:#2a78d6"/><text class="bar-value" x="882" y="921">17.1 / 100.000</text><text class="tile-sub" x="66" y="950">Slovenija: najvišja standardizirana stopnja umrljivosti zaradi samomora med vsemi 27 članicami EU (skoraj 2x povprečje EU); Občina Črnomelj je tik pod</text><text class="tile-sub" x="66" y="965">tem že ekstremnim nacionalnim povprečjem, a znatno nad povprečjem EU. Nihanje po letih je zaradi majhne populacije veliko (statistični šum).</text><rect class="callout-bg" x="48" y="1030" width="1084" height="200" rx="12"/><text class="callout-title" x="66" y="1056">Metodološke opombe</text><circle cx="72" cy="1080" r="5" style="fill:#ec835a"/><text class="callout-text" x="90" y="1084">Diabetes: NIJZ kazalnik meri delež prejemnikov zdravil (administrativni, ožji podatek); EU vrednost (7,96 %) je</text><text class="callout-text" x="90" y="1100">starostno standardizirana ocenjena razširjenost (širši, epidemiološki podatek). Nižja NIJZ vrednost NE pomeni nujno</text><text class="callout-text" x="90" y="1116">manj bolezni kot v EU.</text><circle cx="72" cy="1146" r="5" style="fill:#fab219"/><text class="callout-text" x="90" y="1150">Prekomerna prehranjenost: NIJZ kazalnik verjetno združuje prekomerno težo IN debelost v eno kategorijo; EU/OECD</text><text class="callout-text" x="90" y="1166">ločujeta &quot;overweight&quot; (50,6 %) od &quot;obesity&quot; (18,4 % OECD, 19,4 % SLO) kot dva ločena kazalnika.</text><circle cx="72" cy="1196" r="5" style="fill:#fab219"/><text class="callout-text" x="90" y="1200">Za hipertenzijo (razširjenost, ne umrljivost) in zdravila za duševne motnje ni bilo najdenega neposredno primerljivega</text><text class="callout-text" x="90" y="1216">EU povprečja — primerjava ostaja dvostopenjska (Črnomelj/Slovenija) za ta dva kazalnika.</text><line class="rule" x1="48" y1="1258" x2="1132" y2="1258"/><text class="footer-text" x="48" y="1278">Glej: wiki/topics/social-affairs/zdravje-obcina-eu-primerjava.md · wiki/sources/source-summaries/nijz-zdravje-v-obcini.md · raw/web/eurostat-*.md,</text><text class="footer-text" x="48" y="1294">raw/web/oecd-*.md</text><text class="footer-text" x="48" y="1312">Zadnja posodobitev: 2026-07-20</text>
</svg>
