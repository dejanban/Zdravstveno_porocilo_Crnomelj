<text class="h-title" x="48" y="54">Zdravje v Občini Črnomelj — primerjava z EU</text>
<text class="h-subtitle" x="48" y="78">Tristopenjska primerjava: Občina Črnomelj → Slovenija → povprečje EU/OECD</text>
<text class="h-meta" x="48" y="100">Viri: NIJZ "Zdravje v občini" (obcine.nijz.si) · Eurostat (EHIS, vzroki smrti) · OECD "Health at a Glance" / "State of Health in the EU"</text>
