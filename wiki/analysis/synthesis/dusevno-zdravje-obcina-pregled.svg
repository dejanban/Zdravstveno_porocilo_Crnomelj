  .tile-sub { font: 400 10.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
  .panel-bg { fill: var(--panel-bg); }
  .bar-value { font: 700 12.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--ink); }
  .axis-tick { font: 400 10.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill: var(--muted); }
