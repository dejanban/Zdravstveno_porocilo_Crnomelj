<text class="h-title" x="48" y="54">Duševno zdravje v Občini Črnomelj</text>
<text class="h-subtitle" x="48" y="78">Poglobljen pregled: kazalniki duševnega zdravja (NIJZ), razpoložljive storitve in predlagane rešitve</text>
<text class="h-meta" x="48" y="100">Viri: NIJZ "Zdravje v občini" (kazalnika K4.12, K5.7) · Letno poročilo ZD Črnomelj 2025 · Rdeči križ OZ Črnomelj · Občina Črnomelj na kratko</text>
<line class="rule" x1="48" y1="120" x2="1132" y2="120"/>

<rect class="tile-bg" x="48.0" y="138" width="260.5" height="96" rx="10"/>
<rect x="48.0" y="138" width="4" height="96" rx="2" style="fill:#fab219"/>
<text class="tile-label" x="64.0" y="162">Zdravila za duševne motnje</text>
<text class="tile-value" x="64.0" y="194">15,64 %</text>
<text class="tile-sub" x="64.0" y="214">vs. 14,47 % SLO, 14,92 % regija JV Slovenije (K4.12)</text>

<rect class="tile-bg" x="322.5" y="138" width="260.5" height="96" rx="10"/>
<rect x="322.5" y="138" width="4" height="96" rx="2" style="fill:#fab219"/>
<text class="tile-label" x="338.5" y="162">Umrljivost zaradi samomora</text>
<text class="tile-value" x="338.5" y="194">17,1 / 100.000</text>
<text class="tile-sub" x="338.5" y="214">2026; SLO 17,63 — a veliko letno nihanje (glej graf)</text>

<rect class="tile-bg" x="597.0" y="138" width="260.5" height="96" rx="10"/>
<rect x="597.0" y="138" width="4" height="96" rx="2" style="fill:#0ca30c"/>
<text class="tile-label" x="613.0" y="162">Dispanzer za mentalno zdravje</text>
<text class="tile-value" x="613.0" y="194">1 psiholog(inja)</text>
<text class="tile-sub" x="613.0" y="214">zaposlena za poln delovni čas od 1.9.2025</text>

<rect class="tile-bg" x="871.5" y="138" width="260.5" height="96" rx="10"/>
<rect x="871.5" y="138" width="4" height="96" rx="2" style="fill:#fab219"/>
<text class="tile-label" x="887.5" y="162">Indeks staranja prebivalstva</text>
<text class="tile-value" x="887.5" y="194">164</text>
<text class="tile-sub" x="887.5" y="214">vs. 150 SLO — dejavnik tveganja za breme demence/starosti</text>
<text class="section-title" x="48" y="280">Zdravila za duševne motnje: Občina Črnomelj vs. regija vs. Slovenija</text><text class="section-note" x="48" y="292">Delež prebivalcev, ki prejemajo zdravila za duševne motnje (NIJZ K4.12, 2026). Edini pregledani kazalnik, kjer je Občina Črnomelj nad državnim IN</text><text class="section-note" x="48" y="307">nad regijskim povprečjem hkrati.</text><rect class="panel-bg" x="48" y="328" width="1084" height="150" rx="12"/><rect x="266.5" y="367.6" width="90" height="62.4" rx="4" style="fill:#fab219"/><text class="bar-value" x="311.5" y="359.6" text-anchor="middle">15.64%</text><text class="axis-tick" x="311.5" y="448.0" text-anchor="middle">Občina Črnomelj</text><rect x="545.0" y="370.5" width="90" height="59.5" rx="4" style="fill:#898781"/><text class="bar-value" x="590.0" y="362.5" text-anchor="middle">14.92%</text><text class="axis-tick" x="590.0" y="448.0" text-anchor="middle">Regija JV</text><text class="axis-tick" x="590.0" y="461.0" text-anchor="middle">Slovenija</text><rect x="823.5" y="372.3" width="90" height="57.7" rx="4" style="fill:#2a78d6"/><text class="bar-value" x="868.5" y="364.3" text-anchor="middle">14.47%</text><text class="axis-tick" x="868.5" y="448.0" text-anchor="middle">Slovenija</text><line class="rule" x1="78" y1="430" x2="1102" y2="430"/><text class="section-title" x="48" y="524">Umrljivost zaradi samomora skozi leta</text><rect class="panel-bg" x="48" y="536" width="1084" height="190" rx="12"/><text class="section-note" x="62" y="554">Umrljivost zaradi samomora, na 100.000 prebivalcev (NIJZ K5.7) — stolpci, ne črta: glej opombo spodaj o statistični zanesljivosti</text><line class="trend-slo" x1="108" y1="583.4" x2="992" y2="583.4"/><text class="legend-label" x="1002" y="587.4">SLO: 17.63</text><rect x="276.5" y="616.1" width="70" height="41.9" rx="4" style="fill:#2a78d6"/><text class="bar-value" x="311.5" y="608.1" text-anchor="middle">9.9</text><text class="axis-tick" x="311.5" y="676.0" text-anchor="middle">2022</text><rect x="515.0" y="589.5" width="70" height="68.5" rx="4" style="fill:#2a78d6"/><text class="bar-value" x="550.0" y="581.5" text-anchor="middle">16.2</text><text class="axis-tick" x="550.0" y="676.0" text-anchor="middle">2023</text><rect x="753.5" y="585.7" width="70" height="72.3" rx="4" style="fill:#2a78d6"/><text class="bar-value" x="788.5" y="577.7" text-anchor="middle">17.1</text><text class="axis-tick" x="788.5" y="676.0" text-anchor="middle">2026</text><line class="rule" x1="108" y1="658" x2="992" y2="658"/><text class="section-note" x="62" y="697">Veliko medletno nihanje (9,9 → 16,2 → 17,1) je verjetno statistični šum zaradi majhne populacije občine, ne jasen naraščajoč trend — potrebnih je</text><text class="section-note" x="62" y="712">več let podatkov za zanesljivo sklepanje.</text><text class="section-title" x="48" y="772">Storitve in viri pomoči v občini</text><rect class="tile-bg" x="48.0" y="784" width="352.0" height="142" rx="10"/><rect x="48.0" y="784" width="352.0" height="4" rx="2" style="fill:#0ca30c"/><text class="card-title" x="62.0" y="810">ZD Črnomelj — dispanzer za</text><text class="card-title" x="62.0" y="825">mentalno zdravje</text><text class="card-body" x="62.0" y="843">En psiholog/psihologinja, zaposlen(a) za</text><text class="card-body" x="62.0" y="857">poln delovni čas od 1.9.2025. Letno</text><text class="card-body" x="62.0" y="871">poročilo 2025 hkrati navaja, da je</text><text class="card-body" x="62.0" y="885">iskanje kadra s področja psihologije</text><text class="card-body" x="62.0" y="899">&quot;cedalje večja težava&quot; — dodatne potrebe</text><text class="card-body" x="62.0" y="913">po kadru verjetno ostajajo.</text><rect class="tile-bg" x="414.0" y="784" width="352.0" height="142" rx="10"/><rect x="414.0" y="784" width="352.0" height="4" rx="2" style="fill:#fab219"/><text class="card-title" x="428.0" y="810">Rdeči križ OZ Črnomelj — Program</text><text class="card-title" x="428.0" y="825">Mira</text><text class="card-body" x="428.0" y="843">Območni center za duševno zdravje, ki ga</text><text class="card-body" x="428.0" y="857">vodi Rdeči križ (ne ZD Črnomelj). Ali</text><text class="card-body" x="428.0" y="871">obstaja formalno sodelovanje/napotitev</text><text class="card-body" x="428.0" y="885">med tema dvema viroma pomoči, ni bilo</text><text class="card-body" x="428.0" y="899">najdeno v virih.</text><rect class="tile-bg" x="780.0" y="784" width="352.0" height="142" rx="10"/><rect x="780.0" y="784" width="352.0" height="4" rx="2" style="fill:#fab219"/><text class="card-title" x="794.0" y="810">Demografski dejavnik tveganja</text><text class="card-body" x="794.0" y="828">Indeks staranja 164 (SLO: 150) pomeni</text><text class="card-body" x="794.0" y="842">razmeroma staro prebivalstvo. Državna</text><text class="card-body" x="794.0" y="856">NIJZ projekcija: do 2030 več kot 3 %</text><text class="card-body" x="794.0" y="870">prebivalstva Slovenije z demenco —</text><text class="card-body" x="794.0" y="884">skoraj dvakrat več kot danes (ni</text><text class="card-body" x="794.0" y="898">občinsko specifičen podatek).</text><rect class="callout-bg" x="48" y="954" width="1084" height="234" rx="12"/><text class="callout-title" x="66" y="980">⚠ Odprta tveganja in nerešena vprašanja</text><circle cx="72" cy="1004" r="5" style="fill:#fab219"/><text class="callout-text" x="90" y="1008">Zdravila za duševne motnje: Občina Črnomelj je nad državnim IN nad regijskim povprečjem — vzrok (dostopnost storitev,</text><text class="callout-text" x="90" y="1024">socialno-ekonomski dejavniki, dejanska razširjenost) ni pojasnjen v razpoložljivih virih.</text><circle cx="72" cy="1054" r="5" style="fill:#fab219"/><text class="callout-text" x="90" y="1058">Zavod ZD Črnomelj sam navaja rastočo težavo pri iskanju psihološkega kadra, kljub zaposlitvi ene psihologinje</text><text class="callout-text" x="90" y="1074">septembra 2025 — ni jasno, ali ena zaposlitev zadostuje povpraševanju.</text><circle cx="72" cy="1104" r="5" style="fill:#fab219"/><text class="callout-text" x="90" y="1108">Rdeči križ (Program Mira) in ZD Črnomelj (dispanzer za mentalno zdravje) delujeta kot dva ločena vira pomoči brez</text><text class="callout-text" x="90" y="1124">dokumentiranega formalnega sodelovanja.</text><circle cx="72" cy="1154" r="5" style="fill:#ec835a"/><text class="callout-text" x="90" y="1158">Umrljivost zaradi samomora je zelo nihajoča (9,9 do 17,1 na 100.000 v štirih letih) — vzrok tega nihanja ni pojasnjen,</text><text class="callout-text" x="90" y="1174">kar otežuje razlikovanje statističnega šuma od dejanskega poslabšanja.</text><rect class="solutions-bg" x="48" y="1216" width="1084" height="258" rx="12"/><text class="solutions-title" x="66" y="1242">✓ Možne rešitve</text><text class="solutions-period" x="66.0" y="1266">Kratkoročno (0–12 mesecev)</text><line class="rule" x1="66.0" y1="1274" x2="393.3333333333333" y2="1274"/><circle cx="70.0" cy="1290" r="3" class="solutions-dot"/><text class="solutions-text" x="82.0" y="1294">Javno objaviti podatke o dostopnosti in</text><text class="solutions-text" x="82.0" y="1308">čakalni dobi dispanzerja za mentalno zdravje</text><text class="solutions-text" x="82.0" y="1322">ZD Črnomelj.</text><circle cx="70.0" cy="1342" r="3" class="solutions-dot"/><text class="solutions-text" x="82.0" y="1346">Vzpostaviti formalno povezavo/napotitveno pot</text><text class="solutions-text" x="82.0" y="1360">med ZD Črnomelj (dispanzer za mentalno</text><text class="solutions-text" x="82.0" y="1374">zdravje) in Rdečim križem (Program Mira), da</text><text class="solutions-text" x="82.0" y="1388">uporabniki ne ostanejo med dvema nepovezanima</text><text class="solutions-text" x="82.0" y="1402">sistemoma.</text><circle cx="70.0" cy="1422" r="3" class="solutions-dot"/><text class="solutions-text" x="82.0" y="1426">Preveriti pri zavodu, ali ena zaposlena</text><text class="solutions-text" x="82.0" y="1440">psihologinja (od sept. 2025) zadostuje</text><text class="solutions-text" x="82.0" y="1454">trenutnemu povpraševanju, ali so potrebne</text><text class="solutions-text" x="82.0" y="1468">dodatne zaposlitve.</text><text class="solutions-period" x="421.3333333333333" y="1266">Srednjeročno (1–3 leta)</text><line class="rule" x1="421.3333333333333" y1="1274" x2="748.6666666666666" y2="1274"/><circle cx="425.3333333333333" cy="1290" r="3" class="solutions-dot"/><text class="solutions-text" x="437.3333333333333" y="1294">Analizirati vzroke nadpovprečnega deleža</text><text class="solutions-text" x="437.3333333333333" y="1308">prejemnikov zdravil za duševne motnje</text><text class="solutions-text" x="437.3333333333333" y="1322">(dostopnost storitev vs. socialno-ekonomski</text><text class="solutions-text" x="437.3333333333333" y="1336">dejavniki vs. demografija).</text><circle cx="425.3333333333333" cy="1356" r="3" class="solutions-dot"/><text class="solutions-text" x="437.3333333333333" y="1360">Razviti preventivne programe za duševno</text><text class="solutions-text" x="437.3333333333333" y="1374">zdravje mladih in starejših, morda v povezavi</text><text class="solutions-text" x="437.3333333333333" y="1388">s šolami in Ljudsko univerzo Črnomelj.</text><circle cx="425.3333333333333" cy="1408" r="3" class="solutions-dot"/><text class="solutions-text" x="437.3333333333333" y="1412">Vzpostaviti zgodnje presejanje/spremljanje</text><text class="solutions-text" x="437.3333333333333" y="1426">demence glede na nadpovprečno starajoče se</text><text class="solutions-text" x="437.3333333333333" y="1440">prebivalstvo (indeks staranja 164).</text><text class="solutions-period" x="776.6666666666666" y="1266">Dolgoročno (3–10 let)</text><line class="rule" x1="776.6666666666666" y1="1274" x2="1104.0" y2="1274"/><circle cx="780.6666666666666" cy="1290" r="3" class="solutions-dot"/><text class="solutions-text" x="792.6666666666666" y="1294">Spremljati večletni trend umrljivosti zaradi</text><text class="solutions-text" x="792.6666666666666" y="1308">samomora, da se statistični šum majhne</text><text class="solutions-text" x="792.6666666666666" y="1322">populacije loči od dejanskega trenda.</text><circle cx="780.6666666666666" cy="1342" r="3" class="solutions-dot"/><text class="solutions-text" x="792.6666666666666" y="1346">Vzpostaviti trajnostno kadrovsko strategijo za</text><text class="solutions-text" x="792.6666666666666" y="1360">psihološke/psihiatrične storitve v obmejni,</text><text class="solutions-text" x="792.6666666666666" y="1374">redko poseljeni regiji (npr. štipendiranje,</text><text class="solutions-text" x="792.6666666666666" y="1388">povezava z izobraževalnimi ustanovami — po</text><text class="solutions-text" x="792.6666666666666" y="1402">zgledu splošne kadrovske strategije ZD).</text><circle cx="780.6666666666666" cy="1422" r="3" class="solutions-dot"/><text class="solutions-text" x="792.6666666666666" y="1426">Pripraviti občinsko strategijo za duševno</text><text class="solutions-text" x="792.6666666666666" y="1440">zdravje, usklajeno z naraščajočim deležem</text><text class="solutions-text" x="792.6666666666666" y="1454">starejših prebivalcev.</text><line class="rule" x1="48" y1="1502" x2="1132" y2="1502"/><text class="footer-text" x="48" y="1522">Metodološka opomba: kazalnik K4.12 (zdravila za duševne motnje) je na voljo le kot enoletni posnetek (2026) — v virih ni bilo najdenega večletnega</text><text class="footer-text" x="48" y="1538">trenda za ta kazalnik (za razliko od splošne umrljivosti v spremljajočem infografiku o splošnem zdravju). Podatek o demenci (do 2030 &gt;3 %</text><text class="footer-text" x="48" y="1554">prebivalstva) je državna, ne občinska projekcija (NIJZ, prek sekundarnega poročanja Radio Odeon) — naveden je kot kontekst ob starajočem se</text><text class="footer-text" x="48" y="1570">prebivalstvu občine, ne kot lokalna napoved.</text><text class="footer-text" x="48" y="1590">Glej: wiki/sources/source-summaries/nijz-zdravje-v-obcini.md · wiki/sources/source-summaries/zd-crnomelj-letno-porocilo-2025.md ·</text><text class="footer-text" x="48" y="1606">wiki/entities/associations/pregled-drustev.md · javno-porocilo/poglavja/01-obcina-na-kratko.md</text><text class="footer-text" x="48" y="1624">Zadnja posodobitev: 2026-07-18</text>
</svg>
